name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  CI:
    name: CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Compile contracts
        run: bun run compile

      - name: Test (contracts)
        run: bun run test

      - name: Lint (contracts)
        run: bun run lint

      - name: Install oracle dependencies
        run: cd oracle && bun install --frozen-lockfile

      # The oracle's contractUtility tests resolve providers from RPC URL env
      # vars (supplied via a local .env outside CI). Provide public placeholder
      # endpoints so the suite runs without a .env; providers are constructed
      # lazily, so no network calls are made.
      - name: Test (oracle)
        env:
          SAPPHIRE_MAINNET_RPC: https://sapphire.oasis.io
          SAPPHIRE_TESTNET_RPC: https://testnet.sapphire.oasis.io
          SAPPHIRE_LOCALNET_RPC: http://localhost:8545
          BASE_MAINNET_RPC: https://mainnet.base.org
          BASE_SEPOLIA_TESTNET_RPC: https://sepolia.base.org
        run: cd oracle && bun run test
